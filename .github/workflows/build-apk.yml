name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Setup Capacitor Android
        run: |
          npm install --save-dev @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/Nubung-Yuk.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nubung-Yuk-APK
          path: release-assets/Nubung-Yuk.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Nubung Yuk v1.0.0 (APK Android)' }}
          body: |
            ## 📱 Unduh Aplikasi Nubung Yuk (APK Android)
            File APK resmi **Nubung Yuk** siap diunduh dan dipasang langsung di perangkat Android Anda.
            
            - **Nama File**: `Nubung-Yuk.apk`
            - **Platform**: Android
            - **Mode**: 100% Offline & Privat
          files: release-assets/Nubung-Yuk.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
